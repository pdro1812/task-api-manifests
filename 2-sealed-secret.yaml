# Senha do Redis selada com o certificado do controller deste cluster (kubeseal v0.41.2).
# Para outro cluster, sele de novo (ver README) ou restaure a chave do controller.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: task-api-secret
  namespace: task-api
  annotations:
    # O CRD vem do Application sealed-secrets (sync-wave -1); evita falha de dry-run num cluster novo
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  encryptedData:
    REDIS_PASSWORD: 
  template:
    metadata:
      name: task-api-secret
      namespace: task-api
