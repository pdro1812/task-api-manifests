# Controller do Sealed Secrets (bitnami/sealed-secrets v0.41.2), instalado pelo Argo CD a partir de
# sealed-secrets/controller-v0.41.2.yaml (cópia do release oficial:
# https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.41.2/controller.yaml).
# Precisa estar instalado antes de o task-api-app sincronizar o SealedSecret (sync-wave -1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/pdro1812/task-api-manifests
    targetRevision: HEAD
    path: sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
